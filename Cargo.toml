[workspace]
resolver = "3"
members = ["crates/rekora-core", "crates/rekora-store", "crates/rekora-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robgallardof/rekora"
publish = false

[workspace.dependencies]
rekora-core = { path = "crates/rekora-core" }
rekora-store = { path = "crates/rekora-store" }
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1"
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "time"] }
uuid = { version = "1.29.0", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
