[workspace]
resolver = "3"
members = ["crates/rekora-core", "crates/rekora-store", "crates/rekora-code", "crates/rekora-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/robgallardof/rekora"
publish = false

[workspace.dependencies]
rekora-core = { path = "crates/rekora-core" }
rekora-store = { path = "crates/rekora-store" }
rekora-code = { path = "crates/rekora-code" }
anyhow = "1.0.104"
ignore = "0.4.33"
tree-sitter = "0.27.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
toml_edit = "0.25.17"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
regex = "1"
rmcp = { version = "3.7.0", features = ["server", "transport-io", "macros"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "time"] }
uuid = { version = "1.29.0", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
