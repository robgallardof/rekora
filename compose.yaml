services:
  rekora:
    build: .
    image: rekora:local
    user: ${REKORA_USER:-10001:10001}
    init: true
    command: ["mcp", "serve", "--http", "--listen", "0.0.0.0:8080"]
    environment:
      REKORA_MCP_TOKEN: ${REKORA_MCP_TOKEN:?Set REKORA_MCP_TOKEN to a random token of at least 32 characters}
    ports:
      - "${REKORA_BIND_ADDRESS:-127.0.0.1}:${REKORA_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${REKORA_PROJECT:-.}
        target: /workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
