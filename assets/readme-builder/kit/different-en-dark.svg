<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="406" viewBox="0 0 1200 406" role="img" aria-label="One binary: No runtime, no daemon, no server to host. · No LLM writes: Nothing is summarized or rewritten by a model before it is stored. · No self-verify: Agent text stays candidate until a human verifies it. · Strict abstention: Below the coverage floor the answer is no_evidence, not a guess. · Versioned handoffs: Concurrent edits fail with version_conflict instead of overwriting. · Worktree-aware: One store per repository, shared by linked worktrees, ranked by branch." data-readme-component="bento"><title>One binary: No runtime, no daemon, no server to host. · No LLM writes: Nothing is summarized or rewritten by a model before it is stored. · No self-verify: Agent text stays candidate until a human verifies it. · Strict abstention: Below the coverage floor the answer is no_evidence, not a guess. · Versioned handoffs: Concurrent edits fail with version_conflict instead of overwriting. · Worktree-aware: One store per repository, shared by linked worktrees, ranked by branch.</title><defs><linearGradient id="kb" x2="1" y2="0"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient><linearGradient id="kbd" x2="1" y2="1"><stop stop-color="#7c3aed"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><style>text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif}.orb{animation:orb 10s ease-in-out infinite}@keyframes orb{0%,100%{opacity:.08}50%{opacity:.22}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="0.75" y="0.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="24" y="24" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(33 33) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></g><text x="78" y="49" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">RUST</text><text x="24" y="100" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">One binary</text><text x="24" y="130" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">No runtime, no daemon, no server to</text><text x="24" y="152" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">host.</text><rect x="405.417" y="0.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="428.667" y="24" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(437.667 33) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 8 8 8m0-8-8 8"/></g><text x="482.667" y="49" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">WRITES</text><text x="428.667" y="100" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">No LLM writes</text><text x="428.667" y="130" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">Nothing is summarized or rewritten by a</text><text x="428.667" y="152" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">model before it is stored.</text><rect x="810.083" y="0.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="833.333" y="24" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(842.333 33) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></g><text x="887.333" y="49" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">TRUST</text><text x="833.333" y="100" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">No self-verify</text><text x="833.333" y="130" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">Agent text stays candidate until a human</text><text x="833.333" y="152" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">verifies it.</text><rect x="0.75" y="210.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="24" y="234" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(33 243) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></g><text x="78" y="259" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">SEARCH</text><text x="24" y="310" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">Strict abstention</text><text x="24" y="340" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">Below the coverage floor the answer is</text><text x="24" y="362" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">no_evidence, not a guess.</text><rect x="405.417" y="210.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="428.667" y="234" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(437.667 243) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-4-4m4 4-4 4M19 17H5l4 4m-4-4 4-4"/></g><text x="482.667" y="259" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">TASKS</text><text x="428.667" y="310" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">Versioned handoffs</text><text x="428.667" y="340" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">Concurrent edits fail with</text><text x="428.667" y="362" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">version_conflict instead of overwriting.</text><rect x="810.083" y="210.75" width="389.167" height="194.5" rx="20" fill="#10162a" stroke="#253150" stroke-width="1.5"/><rect x="833.333" y="234" width="40" height="40" rx="12" fill="url(#kbd)" opacity=".15"/><g transform="translate(842.333 243) scale(0.916667)" fill="none" stroke="#a78bfa" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M6 7v10m12-10v2a5 5 0 0 1-5 5H6"/></g><text x="887.333" y="259" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="start" letter-spacing="1.8">GIT</text><text x="833.333" y="310" font-size="23" font-weight="700" fill="#e8edf7" text-anchor="start">Worktree-aware</text><text x="833.333" y="340" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">One store per repository, shared by</text><text x="833.333" y="362" font-size="17" font-weight="400" fill="#9aa7bf" text-anchor="start">linked worktrees, ranked by branch.</text></svg>
