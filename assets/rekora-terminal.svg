<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Rekora terminal session: store a verified decision, search with an explained score, detect a stale source and answer no_evidence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1424"/><stop offset="1" stop-color="#0a0e1a"/></linearGradient>
    <style>
      .t { font-family: "Cascadia Code", "JetBrains Mono", Consolas, Menlo, "DejaVu Sans Mono", monospace; font-size: 13.5px; white-space: pre; }
      .h { font-family: "Segoe UI", -apple-system, Arial, sans-serif; font-size: 13px; fill: #64748b; }
    </style>
  </defs>
  <rect width="1200" height="420" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="#1e293b"/>
  <circle cx="28" cy="24" r="6.5" fill="#ff5f57"/><circle cx="50" cy="24" r="6.5" fill="#febc2e"/><circle cx="72" cy="24" r="6.5" fill="#28c840"/>
  <text x="600" y="28.5" text-anchor="middle" class="h">rekora — your-repo</text>
  <line x1="0" y1="44" x2="1200" y2="44" stroke="#1e293b"/>
  <text x="28" y="74" class="t"><tspan fill="#a78bfa">$</tspan> <tspan fill="#e2e8f0">rekora memory add --type decision --source docs/adr/0001.md:3 --verified &quot;The local store uses SQLite in WAL mode&quot;</tspan></text><text x="28" y="97" class="t" fill="#94a3b8">Stored 01a179ab-5562 [decision | verified] The local store uses SQLite in WAL mode</text><text x="28" y="143" class="t"><tspan fill="#a78bfa">$</tspan> <tspan fill="#e2e8f0">rekora memory search &quot;sqlite store&quot; --explain</tspan></text><text x="28" y="166" class="t" fill="#c4b5fd">- [decision | verified] The local store uses SQLite in WAL mode (src: docs/adr/0001.md:3) #01a179ab-5562</text><text x="28" y="189" class="t" fill="#64748b">    score 1.200 = relevance 1.000 (coverage 1.00 [sqlite store], bm25 rel 1.00) x kind 1.20 x status 1.00 x freshness 1.00</text><text x="28" y="212" class="t" fill="#4ade80">    source docs/adr/0001.md:3: Fresh</text><text x="28" y="258" class="t" fill="#475569"># someone edits docs/adr/0001.md ...</text><text x="28" y="281" class="t"><tspan fill="#a78bfa">$</tspan> <tspan fill="#e2e8f0">rekora memory search &quot;sqlite store&quot;</tspan></text><text x="28" y="304" class="t" fill="#fbbf24">- [decision | verified | POSSIBLY STALE] The local store uses SQLite in WAL mode (src: docs/adr/0001.md:3)</text><text x="28" y="350" class="t"><tspan fill="#a78bfa">$</tspan> <tspan fill="#e2e8f0">rekora memory search &quot;kubernetes helm charts&quot;</tspan></text><text x="28" y="373" class="t" fill="#64748b">no_evidence: no memory in this scope matches any query term</text>
</svg>
